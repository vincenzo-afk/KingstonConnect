<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="KingstonConnect - A modern web platform for seamless college communication, collaboration, and academic management." />
  <meta name="theme-color" content="#0a0f14" />

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <title>KingstonConnect - College Management Platform</title>
<script>
  // One-time cleanup: the app used to seed a demo account (John Doe / 21BCE1234)
  // in localStorage. Remove it so every student sees only their own data.
  try {
    var auRaw = localStorage.getItem('kingston-auth');
    if (auRaw) {
      var auParsed = JSON.parse(auRaw);
      var auUser = auParsed && auParsed.state && auParsed.state.user;
      if (auUser && (auUser.name === 'John Doe' || auUser.rollNumber === '21BCE1234')) {
        localStorage.removeItem('kingston-auth');
      }
    }
  } catch (e) { /* keep default */ }

  // Apply the persisted theme BEFORE React hydrates to prevent a flash of the wrong mode.
  // Matches the zustand persist key used in src/stores/uiStore.ts ('kingston-ui').
  (function () {
    try {
      var raw = localStorage.getItem('kingston-ui');
      if (raw) {
        var parsed = JSON.parse(raw);
        var theme = parsed && parsed.state && parsed.state.theme;
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.classList.add(theme);
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#ffffff');
          } else {
            document.documentElement.classList.remove('light');
          }
        }
      }
    } catch (e) { /* keep default */ }
  })();
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
